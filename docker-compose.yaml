# O nginx do host (nativo) continua dono das portas 80/443 e dos certificados.
# Ele faz proxy de moang.com.br -> 127.0.0.1:8080 e dev.moang.com.br -> 127.0.0.1:9090.
services:
  database:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env da raiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env da raiz}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env da raiz}
    volumes:
      - postgres_data:/var/lib/postgresql
      # Cria o banco "moang_dev" na primeira inicialização do volume
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      BLOG_ADDRESS: 0.0.0.0
      BLOG_PORT: "5000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      # URLs públicas (ActivityPub e frontend) de PRODUÇÃO.
      # TODO (domínio real): trocar pelo https://moang.com.br, moang.com.br e https://moang.com.br
      BASE_URL: http://localhost
      BASE_URL_NAME: localhost
      FRONTEND_URL: http://localhost
    volumes:
      - ./backend/content:/app/content
    ports:
      - "127.0.0.1:8080:5000"
    depends_on:
      database:
        condition: service_healthy

  backend-dev:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    environment:
      BLOG_ADDRESS: 0.0.0.0
      BLOG_PORT: "5000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/moang_dev
      # URLs públicas de DEV.
      # TODO (domínio real): trocar pelo https://dev.moang.com.br e dev.moang.com.br
      BASE_URL: http://localhost:9090
      BASE_URL_NAME: localhost:9090
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend/content-dev:/app/content
    ports:
      - "127.0.0.1:9090:5000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
