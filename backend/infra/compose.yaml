services:
  nginx:
    build:
      context: .
      dockerfile: "DockerfileNginx"
    ports:
      - "6060:80"
    deploy:
      replicas: 1

  app:
    image: "localhost/moang-backend:0.1.0"
    env_file:
      - "../.env"
    ports:
      - "5000:5000"
    deploy:
      replicas: 1

  database:
    image: "docker.io/library/postgres:14.18"
    volumes:
      - local-moang:/var/lib/postgres/data
    env_file:
      - "../.env"
    ports:
      - "5432:5432"
    deploy:
      replicas: 1

volumes:
  local-moang:
